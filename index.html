<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <meta
      name="description"
      content="Um site para gerenciar extensões do navegador"
    />
    <title>Extensions</title>
  </head>
  <body class="container">
    <header class="header">
      <img class="logo" src="./assets/images/logo.svg" alt="Logo" />
      <button class="toggle-theme">
        <img
          class="theme-logo"
          src="./assets/images/icon-moon.svg"
          alt="Toggle theme"
        />
      </button>
    </header>
    <main>
      <nav class="nav">
        <h2 class="nav-title">Extensions List</h2>
        <ul class="nav-filters">
          <li><button class="filter on" id="all">All</button></li>
          <li><button class="filter" id="active">Active</button></li>
          <li><button class="filter" id="inactive">Inactive</button></li>
        </ul>
      </nav>
      <section class="grid-cards"></section>
    </main>
  </body>
  <script type="module" src="./js/script.js"></script>
</html>
